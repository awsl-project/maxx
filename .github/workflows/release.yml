name: Release

run-name: Release ${{ inputs.release_type }}

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release action type (patch, minor, major)'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.compute-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: compute-version
        run: |
          set -euo pipefail
          release_type="${{ inputs.release_type }}"
          latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
          if [[ -z "$latest_tag" ]]; then
            latest_tag="v0.0.0"
          fi
          version="${latest_tag#v}"
          IFS='.' read -r major minor patch <<< "$version"
          case "$release_type" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
            *)
              echo "Error: unsupported release_type: $release_type"
              exit 1
              ;;
          esac
          new_tag="v${major}.${minor}.${patch}"
          echo "version=$new_tag" >> "$GITHUB_OUTPUT"
          echo "Computed next version: $new_tag (from $latest_tag, bump $release_type)"

      - name: Check if tag exists
        run: |
          if git rev-parse "${{ steps.compute-version.outputs.version }}" >/dev/null 2>&1; then
            echo "Error: Tag ${{ steps.compute-version.outputs.version }} 已存在"
            exit 1
          fi

      - name: Create tag
        run: |
          git tag ${{ steps.compute-version.outputs.version }}
          git push origin ${{ steps.compute-version.outputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.compute-version.outputs.version }}
          name: ${{ steps.compute-version.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false

  build:
    needs: release
    uses: ./.github/workflows/ci-docker-build.yml
    with:
      tag: ${{ needs.release.outputs.version }}
    permissions:
      contents: read
      packages: write

  wails-build:
    needs: release
    uses: ./.github/workflows/ci-wails-build.yml
    with:
      tag: ${{ needs.release.outputs.version }}
    permissions:
      contents: write

  update-homebrew:
    needs: wails-build
    uses: ./.github/workflows/update-homebrew.yml
    with:
      tag: ${{ needs.release.outputs.version }}
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
