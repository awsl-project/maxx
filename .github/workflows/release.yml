name: Release

run-name: Release ${{ inputs.version != '' && inputs.version || 'auto' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如: v1.0.0，留空则自动递增 patch)'
        required: false
        default: ''
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      resolved_version: ${{ steps.resolve-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version (manual or auto-increment)
        id: resolve-version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          INPUT_VERSION="$RELEASE_VERSION"
          if [[ -z "${INPUT_VERSION//[[:space:]]/}" ]]; then
            git fetch --tags --force
          fi
          RESOLVED_VERSION=$(python3 scripts/resolve-release-version.py "$INPUT_VERSION")

          echo "Resolved version: $RESOLVED_VERSION"
          echo "version=$RESOLVED_VERSION" >> "$GITHUB_OUTPUT"
          {
            echo "## Release Version Preview"
            echo ""
            echo "- Input version: ${INPUT_VERSION:-<empty>}"
            echo "- Resolved version: $RESOLVED_VERSION"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate version format
        run: |
          VERSION="${{ steps.resolve-version.outputs.version }}"
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: 版本号格式不正确，应为 vX.Y.Z"
            exit 1
          fi

      - name: Check if tag exists
        run: |
          VERSION="${{ steps.resolve-version.outputs.version }}"
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Error: Tag $VERSION 已存在"
            exit 1
          fi

      - name: Create tag
        run: |
          VERSION="${{ steps.resolve-version.outputs.version }}"
          git tag "$VERSION"
          git push origin "$VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve-version.outputs.version }}
          name: ${{ steps.resolve-version.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false

  build:
    needs: release
    uses: ./.github/workflows/ci-docker-build.yml
    with:
      tag: ${{ needs.release.outputs.resolved_version }}
    permissions:
      contents: read
      packages: write

  wails-build:
    needs: release
    uses: ./.github/workflows/ci-wails-build.yml
    with:
      tag: ${{ needs.release.outputs.resolved_version }}
    permissions:
      contents: write

  update-homebrew:
    needs:
      - release
      - wails-build
    uses: ./.github/workflows/update-homebrew.yml
    with:
      tag: ${{ needs.release.outputs.resolved_version }}
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  update-scoop:
    needs:
      - release
      - wails-build
    uses: ./.github/workflows/update-scoop.yml
    with:
      tag: ${{ needs.release.outputs.resolved_version }}
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
