name: Frontend Consistency

on:
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/actions/frontend-consistency-check/**'
      - '.github/workflows/lint.yml'
      - '.github/workflows/ci-docker-build.yml'
      - '.github/workflows/ci-wails-build.yml'
      - '.github/workflows/release.yml'
      - 'go.mod'
      - 'Dockerfile'
      - 'Dockerfile.ci'
      - 'Taskfile.yml'
      - 'wails.json'

jobs:
  frontend-consistency:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Validate frontend parity with release
        uses: ./.github/actions/frontend-consistency-check
        with:
          run-build: "true"
          run-typecheck: "true"
          run-lint: "true"
