name: Backend Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run go vet
        run: go vet ./internal/... ./cmd/...

      - name: Run unit tests
        run: go test -v -count=1 -timeout 600s ./internal/... ./cmd/...

      - name: Build backend binary
        run: |
          mkdir -p .tmp/ci
          go build -o .tmp/ci/maxx ./cmd/maxx
