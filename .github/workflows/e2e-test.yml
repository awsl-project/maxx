name: E2E Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install and smoke-test admin CLI
        env:
          GOBIN: ${{ runner.temp }}/maxx-cli-bin
        run: |
          go install ./cmd/maxx-cli
          "$GOBIN/maxx-cli" --help
          go test -count=1 ./cmd/maxx-cli/...

      - name: Run E2E tests
        run: go test -v -count=1 -timeout 300s -race ./tests/e2e/...
